[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar-investigator"
version = "0.1.0"
description = "Ask a question about any place on Earth and get a NISAR radar-backed answer with receipts."
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "h5py>=3.11",
  "requests>=2.32",
  "pyproj>=3.6",
  "pillow>=10.0",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["nisar_investigator*"]

[tool.pytest.ini_options]
markers = ["network: test needs internet access and an Earthdata login"]
testpaths = ["tests"]
